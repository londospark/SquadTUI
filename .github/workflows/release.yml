name: Release

on:
  push:
    branches: ['release/*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from csproj
        id: version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' src/SquadTUI/SquadTUI.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION (tag: v$VERSION)"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Tag ${{ steps.version.outputs.tag }} already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "🆕 Tag ${{ steps.version.outputs.tag }} does not exist — creating release."
          fi

      - name: Build cross-platform binaries
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          rids=("win-x64" "win-arm64" "osx-x64" "osx-arm64" "linux-x64" "linux-arm64")
          for rid in "${rids[@]}"; do
            echo "🔨 Building for $rid..."
            dotnet publish src/SquadTUI/SquadTUI.csproj \
              -c Release \
              -r $rid \
              --self-contained \
              -o "dist/$rid"
          done

      - name: Package binaries
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          mkdir -p packages
          
          # Windows: zip
          cd dist/win-x64 && zip -r ../../packages/squadtui-${{ steps.version.outputs.version }}-win-x64.zip . && cd ../..
          cd dist/win-arm64 && zip -r ../../packages/squadtui-${{ steps.version.outputs.version }}-win-arm64.zip . && cd ../..
          
          # macOS and Linux: tar.gz
          cd dist/osx-x64 && tar czf ../../packages/squadtui-${{ steps.version.outputs.version }}-osx-x64.tar.gz . && cd ../..
          cd dist/osx-arm64 && tar czf ../../packages/squadtui-${{ steps.version.outputs.version }}-osx-arm64.tar.gz . && cd ../..
          cd dist/linux-x64 && tar czf ../../packages/squadtui-${{ steps.version.outputs.version }}-linux-x64.tar.gz . && cd ../..
          cd dist/linux-arm64 && tar czf ../../packages/squadtui-${{ steps.version.outputs.version }}-linux-arm64.tar.gz . && cd ../..

      - name: Create git tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --latest \
            packages/*

      - name: Verify release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}"
          echo "✅ Release ${{ steps.version.outputs.tag }} created with 6 platform binaries."
